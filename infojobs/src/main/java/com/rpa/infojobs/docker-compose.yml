version: '3.8'

services:
  # ==================== BANCO DE DADOS ====================
  postgres:
    image: postgres:15-alpine
    container_name: infojobs-postgres
    environment:
      POSTGRES_DB: infojobs_rpa
      POSTGRES_USER: infojobs_user
      POSTGRES_PASSWORD: infojobs_pass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infojobs_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rpa-network

  # ==================== ADMINER (Gerenciador do banco) ====================
  adminer:
    image: adminer:latest
    container_name: infojobs-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rpa-network

  # ==================== APLICAÇÃO SPRING BOOT ====================
  infojobs-app:
    build: .
    container_name: infojobs-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - INFOJOBS_AES_KEY=01234567890123456789012345678901
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/infojobs_rpa
      - SPRING_DATASOURCE_USERNAME=infojobs_user
      - SPRING_DATASOURCE_PASSWORD=infojobs_pass123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rpa-network
    restart: unless-stopped

networks:
  rpa-network:
    driver: bridge

volumes:
  postgres_data:
